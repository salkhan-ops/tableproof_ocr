[project]
name = "tableproof"
version = "0.2.0.dev0"
description = "Deterministic table reconstruction from born-digital PDFs and OCR word boxes."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Runtime dependencies are permissive only (MIT/BSD/Apache/HPND). No AGPL/GPL.
dependencies = [
  "pdfplumber>=0.11,<0.12",   # MIT (pdfminer.six, MIT): native words with boxes
  "pypdfium2>=4.30,<6",       # Apache-2.0 / BSD-3-Clause: page rendering
  "openpyxl>=3.1,<4",         # MIT: XLSX export
  "Pillow>=11",               # MIT-CMU (HPND)
]

[dependency-groups]
# PyMuPDF (AGPL-3.0) is dev-only: it generates the committed benchmark fixture PDFs.
# It is never a runtime dependency and never ships in the wheel.
dev = [
    "pytest>=8,<9",
    "PyMuPDF>=1.24,<2",
    "reportlab>=4.2,<6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tableproof"]

[tool.hatch.build.targets.sdist]
include = ["src/tableproof", "LICENSE", "NOTICE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
