[project]
name = "tableproof"
version = "0.2.0.dev0"
description = "Deterministic table reconstruction from born-digital PDFs and OCR word boxes."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "PyMuPDF>=1.24,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tableproof"]

[tool.hatch.build.targets.sdist]
include = ["src/tableproof", "LICENSE", "NOTICE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
